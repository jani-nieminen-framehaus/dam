<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b87a"/>
      <stop offset="100%" stop-color="#a8864e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#0e0e0e"/>
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#g)" stroke-width="32"/>
  <!-- Aperture blades (6 blades) -->
  <g fill="url(#g)" opacity="0.85">
    <polygon points="512,180 610,340 414,340"/>
    <polygon points="799,346 700,510 610,340"/>
    <polygon points="799,678 610,684 700,510"/>
    <polygon points="512,844 414,684 610,684"/>
    <polygon points="225,678 324,510 414,684"/>
    <polygon points="225,346 414,340 324,510"/>
  </g>
  <!-- Center circle (lens) -->
  <circle cx="512" cy="512" r="140" fill="#0e0e0e"/>
  <circle cx="512" cy="512" r="130" fill="none" stroke="url(#g)" stroke-width="6"/>
  <!-- Inner grid (3x3) representing DAM grid view -->
  <g stroke="url(#g)" stroke-width="4" opacity="0.7">
    <line x1="468" y1="420" x2="468" y2="604"/>
    <line x1="556" y1="420" x2="556" y2="604"/>
    <line x1="420" y1="468" x2="604" y2="468"/>
    <line x1="420" y1="556" x2="604" y2="556"/>
  </g>
</svg>
